# Configuration for cargo audit

[advisories]
# Ignore specific advisories by ID
ignore = [
    # ring 0.16.20 - Some AES functions may panic when overflow checking is enabled
    "RUSTSEC-2025-0009",
    # ring 0.16.20 is unmaintained - waiting for libp2p to update dependencies
    "RUSTSEC-2025-0010",

    # Transitive dependencies from reth/alloy that we cannot update directly:
    # bincode is unmaintained - used by reth-nippy-jar, reth-stages
    "RUSTSEC-2025-0141",
    # derivative is unmaintained - used by various reth crates
    "RUSTSEC-2024-0388",
    # paste is unmaintained - used by alloy-primitives
    "RUSTSEC-2024-0436",
    # rustls-pemfile is unmaintained - used by reqwest via reth
    "RUSTSEC-2025-0134",
    # lru IterMut violates Stacked Borrows - used by discv5, reth-network
    "RUSTSEC-2026-0002",

    # rand 0.8.5 is unsound with a custom logger - no 0.8.x patch available; upgrading
    # to 0.9+ requires a major-version API migration and transitive deps (yamux, libp2p)
    # still require rand 0.8.x
    "RUSTSEC-2026-0097",

    # hickory-proto 0.25.2 - NSEC3 closest-encloser proof unbounded loop; no fixed version
    # available yet. Transitive dependency via reth-dns-discovery (reth v1.11.3) and
    # libp2p-mdns (libp2p 0.56.0) — cannot be updated without bumping reth/libp2p.
    "RUSTSEC-2026-0118",
    # hickory-proto 0.25.2 - O(n²) name compression CPU exhaustion; fix requires >=0.26.1.
    # Transitive dependency via reth-dns-discovery (reth v1.11.3) and libp2p-mdns
    # (libp2p 0.56.0) — both pin hickory-proto to 0.25.x; cannot update without bumping reth.
    "RUSTSEC-2026-0119",

    # core2 0.4.0 is unmaintained and all versions yanked; no replacement available.
    # Transitive dependency via multihash 0.19.3 → multiaddr → libp2p 0.56.0. Cannot update
    # without bumping the malachite/libp2p dependency chain.
    "RUSTSEC-2026-0105",

    # proc-macro-error2 2.0.1 is unmaintained; no newer version available in the 2.x series.
    # Transitive dependency via aquamarine → reth-transaction-pool (reth v1.11.3).
    # Cannot update without bumping reth.
    "RUSTSEC-2026-0173",

    # git2 0.20.4 - potential UB in Remote::list(); no patched version available.
    # Transitive dependency via vergen-git2 9.1.0 → reth-node-core (reth v1.11.3).
    # Cannot update without bumping reth.
    "RUSTSEC-2026-0183",

    # git2 0.20.4 - potential UB with Signature from buffer-created BlameHunk; no patched version.
    # Transitive dependency via vergen-git2 9.1.0 → reth-node-core (reth v1.11.3).
    # Cannot update without bumping reth.
    "RUSTSEC-2026-0184",

    # crypto-bigint 0.5.5 - timing variability in operations meant to be constant-time; fixed
    # in >=0.7.6. No fixed 0.5.x exists. Transitive dependency via elliptic-curve 0.13.8 →
    # k256, p256, ecdsa, alloy-signer 2.0.4. The elliptic-curve 0.13 line requires
    # crypto-bigint ^0.5, so it cannot update without moving off elliptic-curve 0.13.
    "RUSTSEC-2026-0387",

    # hickory-proto / hickory-resolver 0.25.2 via libp2p-dns 0.44.0 → libp2p 0.56.0 →
    # arc-malachitebft-*. Fixed by moving malachite to libp2p 0.57 (hickory 0.26).
    # DNSSEC validation is not compiled in (no dnssec-* feature enabled):
    "RUSTSEC-2026-0504",
    "RUSTSEC-2026-0505",
    "RUSTSEC-2026-0511",
    "RUSTSEC-2026-0512",
    "RUSTSEC-2026-0514",
    "RUSTSEC-2026-0530",
    "RUSTSEC-2026-0531",
    "RUSTSEC-2026-0532",
    # Zone-file and SVCB/HTTPS text parsing; the resolver only parses wire format:
    "RUSTSEC-2026-0487",
    "RUSTSEC-2026-0489",
    "RUSTSEC-2026-0490",
    # Memory amplification from header record counts; reachable only through DNS
    # responses to operator-configured `/dns` peer addresses:
    "RUSTSEC-2026-0491",

    # rmcp 1.4.0 - unbounded response buffering in Streamable HTTP clients; fixed in >=3.9.0.
    # Used only by quake (dev tooling) with the server and stdio transports; the
    # Streamable HTTP client is not compiled in.
    "RUSTSEC-2026-0462",

    # libp2p-gossipsub 0.49.5 - unbounded backoff state from PRUNE messages for unknown
    # topics; fixed in >=0.50.1, which requires libp2p 0.57. Transitive dependency via
    # arc-malachitebft-network (malachite v0.8.2); cannot update without bumping malachite.
    "RUSTSEC-2026-0534",
]
